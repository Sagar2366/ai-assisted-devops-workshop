# Episode 8: AI-Powered CI/CD & GitOps
# GitHub Actions Workflow for AI Code Review
#
# Author: Sagar Utekar
# Prerequisites:
#   - GitHub repository with Actions enabled
#   - ANTHROPIC_API_KEY set as a repository secret
#   - gh CLI authenticated
#   - scripts/ai_review.py in the repository

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic PyGithub

      - name: Run AI Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: python3 scripts/ai_review.py
