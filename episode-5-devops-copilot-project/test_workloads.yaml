# Episode 5: Build a DevOps Copilot
# AI-Assisted DevOps Workshop
# Author: Sagar Utekar
#
# Prerequisites:
#   - kind cluster running (kind create cluster --name devops-copilot)
#   - kubectl configured and pointing to the kind cluster
#
# Usage:
#   kubectl apply -f test_workloads.yaml
#   # Wait 30 seconds for pods to start (and some to crash)
#   kubectl get pods
#
# Expected result:
#   - web-frontend: 3 pods Running (healthy)
#   - api-server: 2 pods in ImagePullBackOff (bad image tag)
#   - payment-service: 2 pods in CrashLoopBackOff (exit 137 simulating OOM)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: default
  labels:
    app: web-frontend
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default
  labels:
    app: api-server
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api
        image: nginx:nonexistent-v999
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment
        image: busybox
        command: ["/bin/sh", "-c", "echo 'Starting payment service...' && sleep 5 && echo 'OOM simulated' && exit 137"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
