# Episode 9: Infrastructure as Code + AI & Security Scanning
# Intentionally insecure Kubernetes deployment manifest for demo testing.
#
# This manifest contains multiple security issues on purpose:
#   - Uses :latest tag (unpinnable, unreproducible)
#   - Hardcoded secrets in environment variables
#   - Privileged container
#   - Runs as root (runAsUser: 0)
#   - No resource requests or limits
#   - No liveness/readiness probes
#   - No security context (readOnlyRootFilesystem, etc.)
#
# Author: Sagar Utekar
# Prerequisites: kubectl, a running Kubernetes cluster (e.g., kind)
# Usage: python3 k8s_scanner.py bad_deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-app
  template:
    metadata:
      labels:
        app: insecure-app
    spec:
      containers:
      - name: app
        image: myapp:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_PASSWORD
          value: "supersecret123"
        - name: API_KEY
          value: "sk-abc123def456"
        securityContext:
          privileged: true
          runAsUser: 0
